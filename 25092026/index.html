<div class="wa-wrap">
    <a class="wa-item wa-share" id="waShare" target="_blank" rel="noopener" title="Share today's paper on WhatsApp">
        <span class="wa-label">ഇന്നത്തെ പത്രം ഷെയർ ചെയ്യുക</span>
        <span class="wa-icon"><svg>
                <use href="#wa-icon" />
            </svg></span>
    </a>
    <a class="wa-item wa-chat" id="waChat" target="_blank" rel="noopener" title="Send news or ad enquiries on WhatsApp">
        <span class="wa-label">വാർത്തയോ പരസ്യമോ അറിയിക്കാൻ WhatsApp ചെയ്യുക</span>
        <span class="wa-icon"><svg>
                <use href="#wa-icon" />
            </svg></span>
    </a>
</div>

<body>
    <div class="paper">
        <header>
            <div class="utility"><span id="edition"></span><span id="dateText"></span></div>
            <div class="masthead">

                <div class="date-block">

                    <b id="day"></b>

                    <div class="date-details">
                        <strong id="monthYear"></strong>
                        <span id="malayalamDate"></span>
                        <span id="hijriDate"></span>
                        <span id="volumeIssue"></span>
                    </div>

                </div>


                <div class="brand">

                    <img src="https://bennykavil-hue.github.io/Eveningpaper/images/logo.png" alt="സായാഹ്ന വാർത്ത"
                        class="paper-logo">

                    <div id="paperName"></div>
                    <small id="tagline"></small>

                </div>


                <div class="motto-area">

                    <div class="motto" id="motto"></div>

                    <div class="special-day" id="specialDay"></div>

                </div>
            </div>

            <nav id="nav"></nav>
        </header>
        <div class="redline"></div>
        <div class="breaking"><b id="breakingLabel">BREAKING</b><span id="breakingNews"></span></div>
        <main>
            <section class="lead-area" id="leadArea"></section>
            <div class="columns">
                <section class="column" id="col1"></section>
                <section class="column" id="col2"></section>
                <section class="column" id="col3"></section>
            </div>
        </main>
        <footer>
            <div class="footer-notice" id="footerNotice"></div>

            <span id="footerName"></span>
            <span id="copyright"></span>

            <div id="dailyHits"> test</div>
        </footer>
        <script src="script.js"></script>
</body>

</html>
